version: v0.4
project:
  name: "Nonexistence of an unrestricted symmetric configuration 93_10"
  description: >-
    No 93 by 93 zero-one incidence matrix has all row and column sums 10
    and pairwise row intersections of size at most one. There is no group
    action, automorphism or cyclicity hypothesis.
